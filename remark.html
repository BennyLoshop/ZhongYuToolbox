
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 用户增长动态交互看板</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            overflow: hidden;
            background-color: #0B0E14;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        /* 隐藏滚动条 */
        ::-webkit-scrollbar {
            display: none;
        }
        /* 玻璃拟态卡片 */
        .glass-panel {
            background: rgba(15, 20, 30, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="text-slate-100 select-none">

    <!-- 3D 渲染画布容器 -->
    <div id="canvas-container" class="absolute inset-0 z-0"></div>

    <!-- 顶栏：轻量化 Material You 风格标题 -->
    <header class="absolute top-0 left-0 right-0 z-10 px-6 py-4 flex items-center justify-between pointer-events-none">
        <div class="flex items-center gap-3 pointer-events-auto">
            <span class="material-symbols-outlined text-3xl p-2 bg-blue-500/20 text-blue-400 rounded-2xl">insights</span>
            <div>
                <h1 class="text-lg font-bold tracking-tight">用户总量增长 3D 时空光轨</h1>
                <p class="text-xs text-slate-400">基于《用户记录.pdf》· 2025/07 - 2026/06 累计用户演变</p>
            </div>
        </div>
        <div class="pointer-events-auto flex items-center gap-2 bg-[#0F141E]/80 px-4 py-2 rounded-full border border-white/5 text-xs text-slate-300">
            <span class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
            实时三维物理场景
        </div>
    </header>

    <!-- 右侧：全局数据指标透视卡片 -->
    <section class="absolute top-24 right-6 z-10 w-80 glass-panel p-5 rounded-3xl shadow-2xl flex flex-col gap-4 pointer-events-auto">
        <div class="border-b border-white/5 pb-3">
            <span class="text-xs font-semibold text-blue-400 uppercase tracking-wider">当前概化数据</span>
            <h2 class="text-lg font-bold mt-1">数据沉淀中心</h2>
        </div>

        <!-- 累计用户量 -->
        <div class="bg-white/5 p-4 rounded-2xl border border-white/5">
            <span class="text-xs text-slate-400 block">累计注册总量</span>
            <div class="flex items-baseline gap-2 mt-1">
                <span id="total-users" class="text-3xl font-bold tracking-tight text-blue-300">414</span>
                <span class="text-xs text-emerald-400 font-semibold flex items-center gap-0.5">
                    <span class="material-symbols-outlined text-sm">trending_up</span>100%
                </span>
            </div>
        </div>

        <!-- 时间轴控制面板 -->
        <div>
            <h3 class="text-xs text-slate-400 font-semibold mb-2">交互式动画控制</h3>
            <div class="grid grid-cols-2 gap-2">
                <button onclick="playGrowthAnimation()" class="flex items-center justify-center gap-2 py-2 px-3 bg-blue-600 hover:bg-blue-500 transition-colors text-xs font-bold rounded-xl shadow-lg shadow-blue-600/20">
                    <span class="material-symbols-outlined text-sm">play_arrow</span>
                    动态重播
                </button>
                <button onclick="resetCamera()" class="flex items-center justify-center gap-2 py-2 px-3 bg-white/5 hover:bg-white/10 transition-colors text-xs font-semibold rounded-xl border border-white/10">
                    <span class="material-symbols-outlined text-sm">filter_center_focus</span>
                    重置视角
                </button>
            </div>
        </div>

        <!-- 3D 交互提示说明 -->
        <div class="text-[11px] text-slate-400 flex items-center gap-2 mt-2 bg-blue-500/5 p-3 rounded-xl border border-blue-500/10">
            <span class="material-symbols-outlined text-base text-blue-400">info</span>
            <span>可用鼠标左键拖拽旋转空间，右键平移，滚轮缩放，双击特定周跳转。</span>
        </div>
    </section>

    <!-- 左下角：故事叙事与分步讲解看板 -->
    <section class="absolute bottom-6 left-6 z-10 w-[22rem] glass-panel p-5 rounded-3xl shadow-2xl pointer-events-auto">
        <div class="flex items-center justify-between border-b border-white/5 pb-3 mb-4">
            <div class="flex items-center gap-2">
                <span class="material-symbols-outlined text-blue-400">explore</span>
                <h3 class="font-bold text-sm">用户成长阶段剖析</h3>
            </div>
            <span id="story-progress" class="text-[10px] bg-blue-500/20 text-blue-300 px-2.5 py-0.5 rounded-full font-bold">1 / 4</span>
        </div>

        <div class="min-h-[100px] flex flex-col justify-between">
            <div>
                <h4 id="story-title" class="text-sm font-bold text-slate-200">正在初始化数据...</h4>
                <p id="story-range" class="text-[11px] text-blue-400 font-medium mt-1">时间周期: --</p>
                <p id="story-desc" class="text-xs text-slate-400 mt-2.5 leading-relaxed">
                    加载中，正在构建增长轨迹...
                </p>
            </div>

            <!-- 控制按钮 -->
            <div class="flex items-center justify-between mt-5 pt-3 border-t border-white/5">
                <button onclick="prevStory()" class="p-2 bg-white/5 hover:bg-white/10 text-slate-300 hover:text-white rounded-xl transition-all disabled:opacity-30 disabled:pointer-events-none" id="btn-prev">
                    <span class="material-symbols-outlined">chevron_left</span>
                </button>
                <div class="flex gap-1.5" id="story-dots">
                    <!-- 动态生成小圆点 -->
                </div>
                <button onclick="nextStory()" class="py-2 px-4 bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold rounded-xl shadow-md transition-all" id="btn-next">
                    下一阶段
                </button>
            </div>
        </div>
    </section>

    <!-- 中央底部：3D 时间坐标轴提示器 -->
    <div class="absolute bottom-6 left-1/2 -translate-x-1/2 z-10 pointer-events-none flex flex-col items-center gap-1.5">
        <div class="bg-black/60 backdrop-blur-md border border-white/10 px-4 py-1.5 rounded-full text-xs text-slate-300 flex items-center gap-2 shadow-lg">

            <span class="material-symbols-outlined text-blue-400">trending_flat</span>

        </div>
        <span class="text-[10px] text-slate-500 tracking-wider">空间 X 轴代表时间维度 · Y 轴代表累计人数</span>
    </div>

        // ----------------- 自然周次解析 -----------------
        function getWeekNumber(d) {
            d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
            d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
            const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
            const weekNo = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
            return { year: d.getUTCFullYear(), week: weekNo };
        }

        function getWeekRangeString(year, week) {
            const simple = new Date(year, 0, 1 + (week - 1) * 7);
            const dow = simple.getDay();
            const ISOweekStart = simple;
            if (dow <= 4) {
                ISOweekStart.setDate(simple.getDate() - simple.getDay() + 1);
            } else {
                ISOweekStart.setDate(simple.getDate() + 8 - simple.getDay());
            }
            const ISOweekEnd = new Date(ISOweekStart);
            ISOweekEnd.setDate(ISOweekStart.getDate() + 6);
            return `${ISOweekStart.getFullYear()}/${String(ISOweekStart.getMonth()+1).padStart(2,'0')}/${String(ISOweekStart.getDate()).padStart(2,'0')} ~ ${String(ISOweekEnd.getMonth()+1).padStart(2,'0')}/${String(ISOweekEnd.getDate()).padStart(2,'0')}`;
        }

        // 解析并建立排序时间戳
        let parsedDates = rawLogs.map(str => new Date(str.replace(/\s+/g, ' ').trim())).sort((a, b) => a - b);
        
        let weeklyMap = {};
        let currentCursor = new Date(parsedDates[0]);
        while (currentCursor <= parsedDates[parsedDates.length - 1]) {
            const { year, week } = getWeekNumber(currentCursor);
            const key = `${year}-W${String(week).padStart(2, '0')}`;
            if (!weeklyMap[key]) {
                weeklyMap[key] = { key: key, count: 0, range: getWeekRangeString(year, week) };
            }
            currentCursor.setDate(currentCursor.getDate() + 1);
        }

        parsedDates.forEach(date => {
            const { year, week } = getWeekNumber(date);
            const key = `${year}-W${String(week).padStart(2, '0')}`;
            if (weeklyMap[key]) weeklyMap[key].count += 1;
        });

        // 整理时间序列
        let runningTotal = 0;
        const weeklyDataset = Object.values(weeklyMap).sort((a, b) => a.key.localeCompare(b.key)).map(item => {
            runningTotal += item.count;
            return { ...item, cumulative: runningTotal };
        });

        // ----------------- 2. 交互叙事剧本 (Story Scripts) -----------------

        // ----------------- 3. Three.js 三维渲染设置 -----------------
        let scene, camera, renderer, controls;
        let pathLine, glowingMesh, pointsGroup, gridHelper;
        const totalPoints = weeklyDataset.length;

        // X轴：-40 到 40 (映射时间轴)
        // Y轴：0 到 25 (映射累计总量，总量 414 映射到 24 左右)
        // Z轴：保持 0 (一维时间折线)
        function mapDataTo3D(index, cumulative) {
            const x = -40 + (index / (totalPoints - 1)) * 80;
            const y = (cumulative / 414) * 24; 
            const z = 0;
            return new THREE.Vector3(x, y, z);
        }

        function init3D() {
            const container = document.getElementById('canvas-container');

            // 场景初始化
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x080A0F);
            scene.fog = new THREE.FogExp2(0x080A0F, 0.015);

            // 摄像机初始化
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(-20, 35, 65);

            // 渲染器初始化
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // 轨道控制器
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.05; // 避免穿透地平线
            controls.minDistance = 15;
            controls.maxDistance = 120;

            // 光源布置
            const ambientLight = new THREE.AmbientLight(0x1F2A3F, 0.8);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0x60A5FA, 1.5);
            dirLight.position.set(20, 40, 20);
            scene.add(dirLight);

            const pointLight = new THREE.PointLight(0x3B82F6, 2, 50);
            pointLight.position.set(0, 15, 10);
            scene.add(pointLight);

            // 3D 底盘科技网格
            gridHelper = new THREE.GridHelper(120, 60, 0x1E293B, 0x0F172A);
            gridHelper.position.y = -0.1;
            scene.add(gridHelper);

            // 绘制主干时间数据线与粒子
            buildDataGeometry();

            // 首秀动画
            playGrowthAnimation();

            // 绑定事件
            window.addEventListener('resize', onWindowResize);
            setupStoryUI();
        }

        // ----------------- 4. 建立 3D 数据实体几何 -----------------
        function buildDataGeometry() {
            pointsGroup = new THREE.Group();
            scene.add(pointsGroup);

            // 提取所有的三维映射坐标点
            const curvePoints = [];
            weeklyDataset.forEach((item, idx) => {
                const pos = mapDataTo3D(idx, item.cumulative);
                curvePoints.push(pos);

                // 创建水晶球式数据节点球
                const isHighlight = [0, 14, 28, weeklyDataset.length-1].includes(idx);
                const sphereGeo = new THREE.SphereGeometry(isHighlight ? 0.6 : 0.35, 16, 16);
                const sphereMat = new THREE.MeshPhongMaterial({
                    color: isHighlight ? 0x60A5FA : 0x3B82F6,
                    emissive: isHighlight ? 0x2563EB : 0x1E40AF,
                    shininess: 100,
                    transparent: true,
                    opacity: 0.9
                });
                const sphereMesh = new THREE.Mesh(sphereGeo, sphereMat);
                sphereMesh.position.copy(pos);
                
                // 附加属性
                sphereMesh.userData = { 
                    weekKey: item.key, 
                    cumulative: item.cumulative,
                    range: item.range,
                    count: item.count
                };

                pointsGroup.add(sphereMesh);
            });

            // 三维多点平滑样条线
            const curve = new THREE.CatmullRomCurve3(curvePoints);
            
            // 采用带管径的 Tube 管道几何体，体现 3D 光轨厚重感
            const tubeGeo = new THREE.TubeGeometry(curve, 120, 0.25, 8, false);
            const tubeMat = new THREE.MeshPhongMaterial({
                color: 0x3B82F6,
                emissive: 0x1D4ED8,
                transparent: true,
                opacity: 0.85,
                shininess: 80
            });
            pathLine = new THREE.Mesh(tubeGeo, tubeMat);
            scene.add(pathLine);

            // 外围发光晕圈管线（稍宽，更透亮）
            const glowGeo = new THREE.TubeGeometry(curve, 120, 0.55, 8, false);
            const glowMat = new THREE.MeshBasicMaterial({
                color: 0x60A5FA,
                transparent: true,
                opacity: 0.22,
                wireframe: true
            });
            glowingMesh = new THREE.Mesh(glowGeo, glowMat);
            scene.add(glowingMesh);

            // 3D 浮雕柱状投影（新增量投影到地面上作为倒影）
            weeklyDataset.forEach((item, idx) => {
                const pos = mapDataTo3D(idx, item.cumulative);
                const shadowHeight = (item.count / 27) * 8; // 新增量高度投影 
                const cylinderGeo = new THREE.CylinderGeometry(0.08, 0.08, shadowHeight, 4);
                const cylinderMat = new THREE.MeshBasicMaterial({
                    color: 0x1E293B,
                    transparent: true,
                    opacity: 0.35
                });
                const cylinder = new THREE.Mesh(cylinderGeo, cylinderMat);
                // 站立在地面上
                cylinder.position.set(pos.x, shadowHeight / 2, pos.z);
                scene.add(cylinder);
            });
        }

        // ----------------- 5. 动画播放引擎 (TWEEN) -----------------
        function playGrowthAnimation() {
            // 让管道线和节点球具有“生长”物理动效
            pathLine.scale.set(0, 1, 1);
            glowingMesh.scale.set(0, 1, 1);
            pointsGroup.children.forEach(child => {
                child.scale.set(0, 0, 0);
            });

            // 1. 光轨伸展
            new TWEEN.Tween(pathLine.scale)
                .to({ x: 1 }, 2200)
                .easing(TWEEN.Easing.Cubic.Out)
                .start();

            new TWEEN.Tween(glowingMesh.scale)
                .to({ x: 1 }, 2200)
                .easing(TWEEN.Easing.Cubic.Out)
                .start();

            // 2. 节点球像雨后春笋般依次冒出
            pointsGroup.children.forEach((mesh, index) => {
                new TWEEN.Tween(mesh.scale)
                    .to({ x: 1, y: 1, z: 1 }, 800)
                    .delay(200 + (index / totalPoints) * 1800)
                    .easing(TWEEN.Easing.Back.Out)
                    .start();
            });

            // 同时恢复镜头到总览全貌
            resetCamera();
        }

        // 平滑移动相机视角
        function tweenCamera(targetPos, targetLookAt, duration = 1800) {
            // 禁止用户在过渡期间频繁强行操作
            controls.enabled = false;

            // 摄像机位置过渡
            new TWEEN.Tween(camera.position)
                .to(targetPos, duration)
                .easing(TWEEN.Easing.Cubic.InOut)
                .start();

            // 轨道中心点过渡
            new TWEEN.Tween(controls.target)
                .to(targetLookAt, duration)
                .easing(TWEEN.Easing.Cubic.InOut)
                .onComplete(() => {
                    controls.enabled = true;
                })
                .start();
        }

        function resetCamera() {
            tweenCamera({ x: -10, y: 25, z: 65 }, { x: 0, y: 10, z: 0 }, 2000);
        }

        // ----------------- 6. 叙事导航器控制器 (Story Board) -----------------
        function setupStoryUI() {
            const dotsContainer = document.getElementById('story-dots');
            dotsContainer.innerHTML = '';
            
            storyChapters.forEach((_, idx) => {
                const dot = document.createElement('button');
                dot.className = `w-2 h-2 rounded-full transition-all duration-300 ${idx === 0 ? 'bg-blue-400 w-5' : 'bg-white/20'}`;
                dot.onclick = () => jumpToStory(idx);
                dotsContainer.appendChild(dot);
            });

            updateStoryContent();
        }

        function updateStoryContent() {
            const story = storyChapters[currentStoryIdx];
            
            // 文本淡入淡出动画过渡
            const title = document.getElementById('story-title');
            const range = document.getElementById('story-range');
            const desc = document.getElementById('story-desc');
            const progress = document.getElementById('story-progress');

            // 物理赋值
            title.textContent = story.title;
            range.textContent = `时间周期: ${story.range}`;
            desc.textContent = story.desc;
            progress.textContent = `${currentStoryIdx + 1} / ${storyChapters.length}`;

            // 圆点激活态切换
            const dots = document.getElementById('story-dots').children;
            for (let i = 0; i < dots.length; i++) {
                if (i === currentStoryIdx) {
                    dots[i].className = "w-2 h-2 rounded-full bg-blue-400 w-5 transition-all duration-300";
                } else {
                    dots[i].className = "w-2 h-2 rounded-full bg-white/20 transition-all duration-300";
                }
            }

            // 更新导航按钮状态
            document.getElementById('btn-prev').disabled = currentStoryIdx === 0;
            const nextBtn = document.getElementById('btn-next');
            if (currentStoryIdx === storyChapters.length - 1) {
                nextBtn.innerHTML = `再看一遍 <span class="material-symbols-outlined text-sm">replay</span>`;
            } else {
                nextBtn.innerHTML = `下一阶段 <span class="material-symbols-outlined text-sm">chevron_right</span>`;
            }

            // 执行 3D 摄像机聚焦平移
            tweenCamera(story.cameraPos, story.lookAt);

            // 耀眼高亮当前聚焦的 3D 节点
            highlightDataNode(story.targetIndex);
        }

        function highlightDataNode(targetIndex) {
            pointsGroup.children.forEach((mesh, idx) => {
                if (idx === targetIndex) {
                    mesh.material.color.setHex(0xF59E0B); // 金色高亮
                    mesh.material.emissive.setHex(0xB45309);
                    mesh.scale.set(1.5, 1.5, 1.5);
                } else {
                    const isHighlight = [0, 14, 28, weeklyDataset.length-1].includes(idx);
                    mesh.material.color.setHex(isHighlight ? 0x60A5FA : 0x3B82F6);
                    mesh.material.emissive.setHex(isHighlight ? 0x2563EB : 0x1E40AF);
                    mesh.scale.set(1, 1, 1);
                }
            });
        }

        function nextStory() {
            if (currentStoryIdx < storyChapters.length - 1) {
                currentStoryIdx++;
            } else {
                currentStoryIdx = 0; // 循环
            }
            updateStoryContent();
        }

        function prevStory() {
            if (currentStoryIdx > 0) {
                currentStoryIdx--;
                updateStoryContent();
            }
        }

        function jumpToStory(idx) {
            currentStoryIdx = idx;
            updateStoryContent();
        }

        // ----------------- 7. 自适应与帧循环 -----------------
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // 渲染主频循环
        function animate(time) {
            requestAnimationFrame(animate);

            TWEEN.update();
            controls.update();

            // 主动增加部分缓和动态——微幅转动光轨外圈，营造离子流动感
            if (glowingMesh) {
                glowingMesh.rotation.x = Math.sin(time * 0.0005) * 0.03;
            }

            renderer.render(scene, camera);
        }

        // 页面资源载入完毕启动
        window.onload = function() {
            init3D();
            animate();
        };
    </script>
</body>
</html>
